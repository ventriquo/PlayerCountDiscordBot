version: "3.9"

services:
  discordcounter:
    build: .
    environment:
      # Set every BOT_* list in the same server order. Separate multiple values with ';'.
      ISDOCKER: "true"
      BOT_NAMES: "Project Zomboid"
      # Replace with the Project Zomboid server address reachable from this container.
      BOT_PUBADDRESSES: "203.0.113.10"
      BOT_PORTS: "16261"
      BOT_DISCORD_TOKENS: "DiscordTokenHere"
      BOT_USENAMETAGS: "false"
      BOT_STATUSES: "0"
      BOT_PROVIDERTYPES: "0"
      BOT_UPDATE_TIME: "30"

      # Text channel for online/offline alert messages. Leave empty to disable alerts.
      DISCORD_CHANNEL_ID: ""

      # Required by the Steam provider. Add other Name,Value pairs with ';'.
      BOT_APPLICATION_VARIABLES: "SteamAPIKey,YourSteamApiKey"

      # Optional: renames a channel with the live player count. It requires Manage Channels.
      # This is not the alert channel setting.
      # BOT_CHANNELIDS: "123456789012345678"
